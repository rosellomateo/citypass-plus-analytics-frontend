name: Deploy frontend container to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build and publish production container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate frontend build configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          : "${VITE_API_BASE_URL:?Define VITE_API_BASE_URL in the production environment}"
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "VITE_API_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_DATA_SOURCE=api
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.FRONTEND_PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate production configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${AZURE_WEBAPP_NAME:?Define AZURE_WEBAPP_NAME in the production environment}"
          : "${AZURE_RESOURCE_GROUP:?Define AZURE_RESOURCE_GROUP in the production environment}"
          : "${VITE_API_BASE_URL:?Define VITE_API_BASE_URL in the production environment}"
          : "${FRONTEND_PUBLIC_URL:?Define FRONTEND_PUBLIC_URL in the production environment}"
          : "${GHCR_PULL_TOKEN:?Define GHCR_PULL_TOKEN in the production environment}"
          : "${AZURE_CLIENT_ID:?Define AZURE_CLIENT_ID in the production environment}"
          : "${AZURE_TENANT_ID:?Define AZURE_TENANT_ID in the production environment}"
          : "${AZURE_SUBSCRIPTION_ID:?Define AZURE_SUBSCRIPTION_ID in the production environment}"
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "VITE_API_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          case "$FRONTEND_PUBLIC_URL" in
            https://*) ;;
            *) echo "FRONTEND_PUBLIC_URL must use HTTPS" >&2; exit 1 ;;
          esac

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure private registry and container port
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USERNAME: ${{ github.repository_owner }}
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings WEBSITES_PORT=80 \
            --output none
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" \
            --container-registry-url "https://$REGISTRY" \
            --container-registry-user "$GHCR_PULL_USERNAME" \
            --container-registry-password "$GHCR_PULL_TOKEN" \
            --output none

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify production health
        env:
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          base_url="${FRONTEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            "${base_url}/health"

      - name: Verify production site
        env:
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          base_url="${FRONTEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error --location --output /dev/null \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "${base_url}/"

      - name: Log out from Azure
        if: always()
        run: az logout
