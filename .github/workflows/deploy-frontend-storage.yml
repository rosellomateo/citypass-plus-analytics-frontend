name: Deploy frontend to Azure Storage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to deploy
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-storage-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Upload frontend to Azure Storage
        uses: azure/cli@v2
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name stcitypassfronttest \
              --destination '$web' \
              --source dist \
              --sas-token "$AZURE_STORAGE_SAS_TOKEN" \
              --overwrite true
