name: Build embedded frontend

on:
  workflow_call:

permissions:
  contents: read

# npm run build:embed genera dist-embed/embed.html autocontenido,
# con __CITYPASS_MODULO__ y __CITYPASS_DATOS__ como marcadores de inyección.
# El pipeline genera el manifiesto y los checksums, sin guardarlos en Git.
jobs:
  package:
    name: Build and validate self-contained HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check frontend packaging prerequisite
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { scripts } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!scripts?.['build:embed']) {
            console.error('Falta implementar build:embed en el frontend. El pipeline no modifica el código de la aplicación.');
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Test detection of corrupted inline code
        run: node --test scripts/validate-embed-code.cases.mjs

      - name: Build embedded frontend
        run: npm run build:embed

      - name: Validate HTML and generate release metadata
        run: node scripts/package-embed.mjs

      - name: Install browser for sandbox verification
        run: npx playwright install --with-deps chromium

      - name: Verify embedded dashboards without network access
        run: npm run test:embed

      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: embed-browser-failures-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save validated package
        uses: actions/upload-artifact@v7
        with:
          name: frontend-embed-${{ github.sha }}
          path: dist-embed/
          if-no-files-found: error
          retention-days: 14
